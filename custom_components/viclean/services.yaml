send_raw:
  fields:
    function:
      required: true
      example: 3
      selector:
        number: {min: 0, max: 255, mode: box}
    command:
      required: true
      example: 0
      selector:
        number: {min: 0, max: 255, mode: box}
    data:
      example: "00 01"
      selector:
        text:
    wait:
      default: 1.5
      selector:
        number: {min: 0.1, max: 10, step: 0.1, mode: box}
